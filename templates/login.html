<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <style>
        body{
            background: linear-gradient(135deg,#667eea,#764ba2);
        }

        .login-box{
            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px black;
        }

        h1{
            text-align:center;
            color:#003366;
        }
    </style>

</head>

<body>

<div class="login-box">

<h1>Student Login</h1>

<form action="/login" method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>

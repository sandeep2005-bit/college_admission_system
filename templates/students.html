<!DOCTYPE html>
<html>
<head>

<title>Registered Students</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    background: linear-gradient(
    135deg,
    #11998e,
    #38ef7d
    );
}

.heading{
    text-align:center;
    color:white;
    margin-top:20px;
}

.table-container{

    width:95%;
    margin:auto;

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:0px 0px 15px black;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f2f2;
}

</style>

</head>

<body>

<h1 class="heading">
Registered Students
</h1>

<div class="table-container">

<table>

<tr>

<th>ID</th>
<th>Username</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Course</th>
<th>Status</th>

</tr>

{% for s in students %}

<tr>

<td>{{ s[0] }}</td>
<td>{{ s[1] }}</td>
<td>{{ s[3] }}</td>
<td>{{ s[4] }}</td>
<td>{{ s[5] }}</td>
<td>{{ s[14] }}</td>
<td>{{ s[15] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
